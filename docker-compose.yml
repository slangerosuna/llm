services:
  app:
    build:
      context: .
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    profiles: ["gpu"]
    devices:
      - /dev/dri:/dev/dri
